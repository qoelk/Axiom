syntax = "proto3";
package server;

message PlayerRequest {
  string playerID = 1;
}

message JoinGameResponse {
  string playerID = 1;
}

service AxiomServer {
   rpc JoinGame (PlayerRequest) returns (JoinGameResponse) {

   }
   rpc GetState (PlayerRequest) returns (State) {}
   rpc SubmitCommand (Command) returns {}
}

